name: Furniture reconstruction contracts
on:
  workflow_dispatch:
  push:
    branches: [experiment/furniture-reconstruction-quality]
permissions:
  contents: read
jobs:
  geometry-and-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest numpy Pillow scipy scikit-image trimesh opencv-python-headless
      - run: python -m pytest tests/test_furniture_quality.py tests/test_furniture_coordinates.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
