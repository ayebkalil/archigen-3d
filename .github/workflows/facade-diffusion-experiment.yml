name: Local facade diffusion contracts
on:
  workflow_dispatch:
  push:
    branches: [experiment/facade-diffusion-control]
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest numpy Pillow opencv-python-headless psutil requests filelock
      - run: python -m pytest tests/test_facade_diffusion.py -q
