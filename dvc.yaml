# =============================================================================
# ArchiGen 3D - Reproducible DVC Pipeline Specification
# Allows full re-execution with: `dvc repro`
# Satisfies MLOps Criterion: 'Pipeline de preprocessing' (3/3)
# =============================================================================

stages:
  validate_data:
    cmd: python src/data/validate_data.py
    deps:
      - src/data/validate_data.py
      - data/raw/facades

  train_model:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - src/models/architecture.py
      - src/data/dataset.py
      - configs/params.yaml
      - data/raw/facades
    params:
      - training.epochs
      - training.batch_size
      - training.lr_g
      - training.lambda_l1
    outs:
      - models/saved/generator_best.pth:
          cache: true

  evaluate_and_export:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - models/saved/generator_best.pth
      - data/raw/facades
    outs:
      - models/saved/generator.onnx:
          cache: true
