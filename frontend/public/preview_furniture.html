<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArchiGen 3D — Furniture Asset Bank Preview</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #f0f0f0;
    }
    #header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
    }
    #header h1 {
      margin: 0;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ff9800;
    }
    #header p {
      margin: 4px 0 0;
      font-size: 11px;
      color: #a0a0a5;
    }
    #legend {
      position: absolute;
      bottom: 15px;
      left: 20px;
      z-index: 10;
      background: rgba(20, 20, 24, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .indicator-arrow {
      width: 14px;
      height: 3px;
      background: #00ff66;
      position: relative;
    }
    .indicator-arrow::after {
      content: '';
      position: absolute;
      right: -2px;
      top: -3px;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #00ff66;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      top: 15px;
      right: 20px;
      z-index: 10;
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 4px;
      color: #00ff66;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="header">
    <h1>ArchiGen 3D — Furniture Asset Bank</h1>
    <p>33 Models (23 Core + 10 Style Variants) • Grounded at Y=0 • Canonical Front (+Z) with Indicator Arrow</p>
  </div>
  <div id="legend">
    <div class="legend-item"><div class="indicator-arrow"></div> <span>Canonical Front Vector (+Z Forward)</span></div>
    <div class="legend-item"><span style="color:#38bdf8;">■</span> <span>Ground Contact Plane (Y=0.00m)</span></div>
    <div class="legend-item"><span style="color:#f59e0b;">■</span> <span>Bounding Wireframe</span></div>
  </div>
  <div id="status">Loading assets...</div>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const statusEl = document.getElementById('status');

    // 1. Scene & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16161a);
    scene.fog = new THREE.FogExp2(0x16161a, 0.015);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // 2. Camera Setup (high isometric overview)
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(24, 22, 28);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff7ed, 2.2);
    dirLight.position.set(20, 35, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 5;
    dirLight.shadow.camera.far = 100;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.9);
    fillLight.position.set(-20, 15, -20);
    scene.add(fillLight);

    // 4. Ground Grid & Floor
    const gridHelper = new THREE.GridHelper(50, 50, 0x334155, 0x1e293b);
    gridHelper.position.y = -0.001;
    scene.add(gridHelper);

    const floorGeo = new THREE.PlaneGeometry(80, 80);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x121215,
      roughness: 0.9,
      metalness: 0.1
    });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = -0.002;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    // 5. Load Catalog & Models
    const loader = new GLTFLoader();

    function createTextSprite(text, subtext) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(20, 24, 30, 0.88)';
      ctx.roundRect(8, 8, 496, 144, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 165, 0, 0.4)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.font = 'bold 36px monospace';
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.fillText(text, 256, 64);

      if (subtext) {
        ctx.font = '24px monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(subtext, 256, 115);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(2.2, 0.7, 1.0);
      return sprite;
    }

    async function loadCatalog() {
      try {
        let resp = await fetch('/catalog.json');
        if (!resp.ok) resp = await fetch('/src/design/catalog.json');
        const catalog = await resp.json();
        const items = Object.values(catalog.items);
        statusEl.innerText = `Loading ${items.length} models...`;

        // Arrange in a grid: 6 columns x 6 rows
        const cols = 6;
        const spacingX = 3.8;
        const spacingZ = 3.8;
        const offsetX = ((cols - 1) * spacingX) / 2;
        const totalRows = Math.ceil(items.length / cols);
        const offsetZ = ((totalRows - 1) * spacingZ) / 2;

        let loadedCount = 0;

        items.forEach((item, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          const posX = col * spacingX - offsetX;
          const posZ = row * spacingZ - offsetZ;

          // Load GLB
          loader.load(
            item.glb,
            (gltf) => {
              const model = gltf.scene;
              model.position.set(posX, 0, posZ);
              
              model.traverse((child) => {
                if (child.isMesh) {
                  child.castShadow = true;
                  child.receiveShadow = true;
                }
              });
              scene.add(model);

              // Bounding box wireframe
              const box = new THREE.Box3().setFromObject(model);
              const boxHelper = new THREE.Box3Helper(box, 0xf59e0b);
              boxHelper.material.opacity = 0.35;
              boxHelper.material.transparent = true;
              scene.add(boxHelper);

              // Front direction indicator arrow (+Z Forward into room)
              const depthHalf = (box.max.z - box.min.z) / 2;
              const arrowDir = new THREE.Vector3(0, 0, 1);
              const arrowOrigin = new THREE.Vector3(posX, 0.05, posZ + depthHalf + 0.15);
              const arrowLength = 0.75;
              const arrowColor = 0x00ff66;
              const arrowHelper = new THREE.ArrowHelper(arrowDir, arrowOrigin, arrowLength, arrowColor, 0.25, 0.15);
              scene.add(arrowHelper);

              // Circular ground anchor dot at (0, 0)
              const dotGeo = new THREE.CircleGeometry(0.12, 16);
              const dotMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
              const dot = new THREE.Mesh(dotGeo, dotMat);
              dot.rotation.x = -Math.PI / 2;
              dot.position.set(posX, 0.02, posZ);
              scene.add(dot);

              // Text label floating above model
              const dims = item.dimensions_m;
              const label = createTextSprite(item.id, `${dims[0]}x${dims[1]}x${dims[2]}m`);
              label.position.set(posX, box.max.y + 0.65, posZ);
              scene.add(label);

              loadedCount++;
              statusEl.innerText = `Loaded ${loadedCount}/${items.length} assets`;
              if (loadedCount === items.length) {
                statusEl.innerText = `All ${items.length} assets ready!`;
                window.__PREVIEW_READY__ = true;
                setTimeout(() => {
                  renderer.render(scene, camera);
                  const dataUrl = renderer.domElement.toDataURL('image/png');
                  fetch('/save_screenshot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                  }).then(() => {
                    statusEl.innerText = 'Screenshot captured & saved to disk!';
                  }).catch(e => console.error(e));
                }, 800);
              }
            },
            undefined,
            (err) => {
              console.error(`Failed to load ${item.id}:`, err);
            }
          );
        });

      } catch (e) {
        statusEl.innerText = `Error: ${e.message}`;
        console.error(e);
      }
    }

    loadCatalog();

    // 6. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
