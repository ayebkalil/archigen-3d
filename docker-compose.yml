services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_REVISION: ${ARCHIGEN_REVISION:-local}
    container_name: archigen_backend
    ports:
      - "127.0.0.1:${ARCHIGEN_API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - ARCHIGEN_FACADE_EXPERIMENT=/app/models/saved/facade512_experiment/generator.onnx
      - ARCHIGEN_CUSTOM_LIBRARY=/app/library
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      - furniture_library:/app/library
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${ARCHIGEN_REVISION:-local}
    container_name: archigen_frontend
    ports:
      - "127.0.0.1:${ARCHIGEN_WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  furniture_library:
